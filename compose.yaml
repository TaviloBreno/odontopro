services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odontopro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odontopro-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-odontopro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - odontopro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odontopro} -d ${POSTGRES_DB:-odontopro}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odontopro-postgres:
