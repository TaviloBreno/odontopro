name: CI

on:
  pull_request:
  push:
    branches: [main, local-integration]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odontopro
          POSTGRES_PASSWORD: odontopro-test
          POSTGRES_DB: odontopro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odontopro -d odontopro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://odontopro:odontopro-test@localhost:5432/odontopro_ci?schema=public
      TEST_DATABASE_URL: postgresql://odontopro:odontopro-test@localhost:5432/odontopro_ci?schema=public
      TEST_LOGIN_EMAIL: demo@odontopro.local
      TEST_EMPLOYEE_EMAIL: funcionario@odontopro.local
      TEST_LOGIN_PASSWORD: ci-demo-password
      TEST_EMPLOYEE_PASSWORD: ci-employee-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --omit=dev
